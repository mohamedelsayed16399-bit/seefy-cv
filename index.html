<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سيفي - اعمل سيرتك الذاتية في دقايق</title>
<meta name="description" content="اعمل سيرة ذاتية (CV) شيك بالعربي أو الإنجليزي، 4 قوالب، صورة، وحمّلها PDF مجاناً بدون تسجيل">
<meta name="theme-color" content="#0f766e">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#eef2f1;color:#1f2937}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:22px}header small{opacity:.9}
.tabs{display:none;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px #0002}
.tabs button{flex:1;padding:12px;border:0;background:none;font-size:16px;font-family:inherit;font-weight:700;color:#555}
.tabs button.on{color:#0f766e;border-bottom:3px solid #0f766e}
main{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
.panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0001}
.panel h2{font-size:16px;margin:16px 0 8px;color:#0f766e;border-bottom:2px solid #ccfbf1;padding-bottom:4px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:13px;margin:8px 0 3px;color:#555}
input,textarea,select{width:100%;padding:9px;border:1px solid #cbd5d1;border-radius:8px;font:inherit;font-size:15px;background:#fafdfc}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#f1f9f7;border:1px dashed #99d5cb;border-radius:10px;padding:10px;margin:8px 0;position:relative}
.card .x{position:absolute;top:4px;left:6px;border:0;background:none;color:#c0392b;font-size:18px;cursor:pointer}
.btn{background:#0f766e;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;font-size:15px}
.btn.l{background:#e6f4f1;color:#0f766e}.btn.big{width:100%;padding:14px;font-size:17px;margin-top:10px}
.tpl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tpl button{padding:8px 2px;border:2px solid #cbd5d1;border-radius:8px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.tpl button.on{border-color:#0f766e;background:#e6f4f1;font-weight:700}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.colors i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #aaa}
.colors i.on{box-shadow:0 0 0 3px #111}
.score{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:6px 0}
.score b{display:block;height:100%;background:#0f766e;transition:width .3s}
.pvbtn{display:none}
.tips{font-size:13px;color:#555;line-height:1.8}
#wrap{overflow:auto;background:#d9e2e0;border-radius:14px;padding:12px;display:flex;justify-content:center}

#cv{width:794px;min-height:1123px;background:#fff;box-shadow:0 4px 18px #0003;font-size:14px;line-height:1.6;color:#222;overflow:hidden}
/* templates */
#cv h1{margin:0;font-size:32px;line-height:1.2}
#cv h3{margin:18px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--c);border-bottom:2px solid var(--c);padding-bottom:3px}
#cv .it{margin:8px 0}#cv .it b{font-size:15px}#cv .it .m{color:#666;font-size:13px}
#cv .it,#cv h3{break-inside:avoid}#cv h3{break-after:avoid}
#cv[dir=ltr] .it p{text-align:left}#cv .it p{margin:3px 0;white-space:pre-wrap}
#cv .chip{display:inline-block;background:var(--c);color:#fff;border-radius:14px;padding:2px 11px;margin:3px;font-size:13px}
#cv .ph{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.t1{display:flex;min-height:1123px}
.t1 .s{width:260px;background:var(--c);color:#fff;padding:28px 18px}
#cv.t1 .s h3{color:#fff;border-color:#fff8}
#cv.t1 .s .chip{background:#fff3;color:#fff}
.t1 .s .ph{display:block;margin:0 auto 14px}
.t1 .mn{flex:1;padding:30px 28px}
.t1 .mn h1{color:var(--c)}
.t2 .hd{background:var(--c);color:#fff;padding:30px 36px;display:flex;align-items:center;gap:20px}
.t2 .bd{padding:20px 36px}
.t2 .ct{font-size:13px;opacity:.95;margin-top:6px}
.t3{padding:40px 46px}
.t3 h1{border-bottom:4px solid var(--c);padding-bottom:8px}
#cv.t3 h3{border:0;font-size:14px;letter-spacing:2px}
.t4{padding:40px 46px;text-align:center}
.t4 .ph{margin:0 auto 10px;display:block}
#cv.t4 h3{text-align:center;border:0;border-top:1px solid #ccc;padding-top:12px}
.t4 .l{text-align:start}
@media(max-width:860px){
 main.pv .pvbtn{display:block}
 .tabs{display:flex}main{grid-template-columns:minmax(0,1fr);padding:10px}#wrap{padding:6px}
 main.pv .panel{display:none}main.ed #wrap,main.ed .pvbtn{display:none}
}
@media print{
 body{background:#fff}header,.tabs,.panel,.pvbtn{display:none!important}
 main{display:block;padding:0;max-width:none}
 #wrap{padding:0;background:none;overflow:visible;display:block}
 
 #cv{box-shadow:none;width:100%}
 @page{size:A4;margin:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<header><h1>📄 سيفي</h1><small>اعمل سيرتك الذاتية في دقايق، مجاناً وبدون تسجيل، وبياناتك على جهازك بس</small></header>
<div class="tabs"><button id="te" class="on">✏️ تعديل</button><button id="tp">👁️ معاينة</button></div>
<main class="ed" id="main">
<section class="panel">
<h2>القالب واللون</h2>
<div class="tpl" id="tpl"></div>
<div class="colors" id="cols"></div>
<div class="row"><div><label>لغة الـ CV</label><select id="lang"><option value="ar">عربي (يمين لشمال)</option><option value="en">English (LTR)</option></select></div>
<div><label>الصورة</label><input type="file" id="photo" accept="image/*"></div></div>
<button class="btn l" id="nophoto" style="margin-top:6px;font-size:13px;padding:6px 10px">إزالة الصورة</button>
<h2>البيانات الأساسية</h2>
<label>الاسم</label><input id="name"><label>المسمى الوظيفي</label><input id="title" placeholder="مثال: محاسب / مطور ويب">
<div class="row"><div><label>الموبايل</label><input id="phone" inputmode="tel"></div><div><label>الإيميل</label><input id="email" inputmode="email"></div></div>
<div class="row"><div><label>المدينة</label><input id="city"></div><div><label>لينك (LinkedIn/موقع)</label><input id="link"></div></div>
<label>نبذة عنك</label><textarea id="sum"></textarea>
<h2>الخبرات <button class="btn l" id="addx" style="float:left;padding:3px 10px">+ إضافة</button></h2><div id="exps"></div>
<h2>التعليم <button class="btn l" id="adde" style="float:left;padding:3px 10px">+ إضافة</button></h2><div id="edus"></div>
<h2>المهارات</h2><label>اكتبهم بينهم فاصلة (،)</label><input id="skills" placeholder="إكسل، خدمة عملاء، Photoshop">
<h2>اللغات</h2><input id="langs" placeholder="العربية (الأم)، English (جيد جداً)">
<h2>كورسات وشهادات</h2><textarea id="certs" placeholder="كل شهادة في سطر"></textarea>
<h2>مشاريع وإنجازات</h2><textarea id="proj" placeholder="كل مشروع أو إنجاز في سطر"></textarea>
<h2>قوة الـ CV</h2><div class="score"><b id="sc"></b></div><div class="tips" id="tips"></div>
<button class="btn big" id="print">⬇️ حمّل PDF / اطبع</button>
<div class="row" style="margin-top:8px"><button class="btn l" id="exp">💾 احفظ نسخة (ملف)</button><button class="btn l" id="imp">📂 افتح نسخة</button></div>
<a class="btn l" id="wa" style="display:block;text-align:center;text-decoration:none;margin-top:8px" target="_blank" href="https://wa.me/?text=%D8%AC%D8%B1%D8%A8%20%D8%B3%D9%8A%D9%81%D9%8A%20%D9%84%D8%B9%D9%85%D9%84%20CV%20%D8%A8%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%20%D9%85%D8%AC%D8%A7%D9%86%D8%A7%3A%20https%3A%2F%2Fmohamedelsayed16399-bit.github.io%2Fseefy-cv%2F">📲 ابعت سيفي لصاحبك على واتساب</a>
<button class="btn l" id="sample" style="width:100%;margin-top:8px">جرّب بيانات تجريبية</button>
<button class="btn l" id="clear" style="width:100%;margin-top:8px;color:#c0392b">مسح كل حاجة</button>
<input type="file" id="impf" accept=".json" hidden>
<p class="tips">في التحميل: اختار "حفظ كـ PDF" من قايمة الطابعة، والهوامش "بدون".</p>
</section>
<section><button class="btn pvbtn" id="back" style="margin-bottom:8px;width:100%">✏️ ارجع للتعديل</button>
<div id="wrap"><div id="pagebox"><div id="cv"></div></div></div></section>
</main>
<script>
var K="seefy_v1",COLS=["#0f766e","#1d4ed8","#9333ea","#be123c","#c2410c","#111827","#0e7490","#4d7c0f"];
var TN=["جانبي","هيدر ملوّن","بسيط","مركزي"];
var D={t:1,c:COLS[0],lang:"ar",photo:"",name:"",title:"",phone:"",email:"",city:"",link:"",sum:"",exps:[],edus:[],skills:"",langs:"",certs:"",proj:""};
try{var s=JSON.parse(localStorage.getItem(K));if(s)for(var k in s)D[k]=s[k]}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var T={ar:{sum:"نبذة",exp:"الخبرات",edu:"التعليم",sk:"المهارات",lg:"اللغات",ce:"كورسات وشهادات",pj:"مشاريع وإنجازات",ct:"التواصل"},
en:{sum:"Summary",exp:"Experience",edu:"Education",sk:"Skills",lg:"Languages",ce:"Certificates",pj:"Projects & Achievements",ct:"Contact"}};
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert("الصورة كبيرة، جرّب صورة أصغر")}}
var F=["name","title","phone","email","city","link","sum","skills","langs","certs","proj"];
F.forEach(function(f){$(f).addEventListener("input",function(){D[f]=$(f).value;upd()})});
$("lang").onchange=function(){D.lang=this.value;upd()};
function fill(){F.forEach(function(f){$(f).value=D[f]||""});$("lang").value=D.lang;lists();tp();upd()}
function tp(){var h="";TN.forEach(function(n,i){h+='<button data-i="'+(i+1)+'" class="'+(D.t==i+1?"on":"")+'">'+n+'</button>'});$("tpl").innerHTML=h;
$("tpl").querySelectorAll("button").forEach(function(b){b.onclick=function(){D.t=+b.dataset.i;tp();upd()}});
var c="";COLS.forEach(function(x){c+='<i data-c="'+x+'" style="background:'+x+'" class="'+(D.c==x?"on":"")+'"></i>'});$("cols").innerHTML=c;
$("cols").querySelectorAll("i").forEach(function(b){b.onclick=function(){D.c=b.dataset.c;tp();upd()}})}
function lists(){
 $("exps").innerHTML=D.exps.map(function(e,i){return '<div class="card"><button class="x" data-k="exps" data-i="'+i+'">✕</button><div class="row"><div><label>الوظيفة</label><input data-k="exps" data-i="'+i+'" data-f="r" value="'+esc(e.r)+'"></div><div><label>الشركة</label><input data-k="exps" data-i="'+i+'" data-f="co" value="'+esc(e.co)+'"></div></div><label>الفترة</label><input data-k="exps" data-i="'+i+'" data-f="p" value="'+esc(e.p)+'" placeholder="2022 - 2024"><label>اللي عملته (سطر لكل نقطة)</label><textarea data-k="exps" data-i="'+i+'" data-f="d">'+esc(e.d)+'</textarea></div>'}).join("");
 $("edus").innerHTML=D.edus.map(function(e,i){return '<div class="card"><button class="x" data-k="edus" data-i="'+i+'">✕</button><div class="row"><div><label>المؤهل</label><input data-k="edus" data-i="'+i+'" data-f="r" value="'+esc(e.r)+'"></div><div><label>الجامعة/المعهد</label><input data-k="edus" data-i="'+i+'" data-f="co" value="'+esc(e.co)+'"></div></div><label>الفترة</label><input data-k="edus" data-i="'+i+'" data-f="p" value="'+esc(e.p)+'"></div>'}).join("");
 document.querySelectorAll("[data-f]").forEach(function(el){el.oninput=function(){D[el.dataset.k][+el.dataset.i][el.dataset.f]=el.value;upd()}});
 document.querySelectorAll(".x").forEach(function(b){b.onclick=function(){D[b.dataset.k].splice(+b.dataset.i,1);lists();upd()}})}
$("addx").onclick=function(){D.exps.push({r:"",co:"",p:"",d:""});lists();upd()};
$("adde").onclick=function(){D.edus.push({r:"",co:"",p:""});lists();upd()};
$("photo").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),s=Math.min(im.width,im.height),z=360;c.width=c.height=z;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);D.photo=c.toDataURL("image/jpeg",.85);upd()};im.src=r.result};r.readAsDataURL(f)};
$("nophoto").onclick=function(){D.photo="";upd()};
function chips(s){return s.split(/[,،\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function sec(h,b){return b?'<h3>'+h+'</h3>'+b:""}
function items(a,ex){return a.filter(function(e){return e.r||e.co}).map(function(e){return '<div class="it"><b>'+esc(e.r)+'</b>'+(e.co?' - '+esc(e.co):"")+(e.p?'<div class="m">'+esc(e.p)+'</div>':"")+(ex&&e.d?'<p>'+esc(e.d.split("\n").filter(Boolean).map(function(x){return "• "+x.replace(/^[•\-\*]\s*/,"")}).join("\n"))+'</p>':"")+'</div>'}).join("")}
function render(){
 var L=T[D.lang],c=$("cv"),dir=D.lang=="ar"?"rtl":"ltr";c.dir=dir;c.style.setProperty("--c",D.c);c.className="t"+D.t;
 var ct=[D.phone,D.email,D.city,D.link].filter(Boolean).map(esc);
 var ph=D.photo?'<img class="ph" src="'+D.photo+'">':"";
 var sk=chips(D.skills).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("");
 var lg=chips(D.langs).map(esc).join("<br>");
 var ce=D.certs.split("\n").filter(function(x){return x.trim()}).map(function(x){return "• "+esc(x)}).join("<br>");
 var pj=D.proj.split("\n").filter(function(x){return x.trim()}).map(function(x){return "• "+esc(x)}).join("<br>");
 var sm=D.sum?'<p style="white-space:pre-wrap;margin:0">'+esc(D.sum)+'</p>':"";
 var nm=esc(D.name||(D.lang=="ar"?"اسمك هنا":"Your Name")),ti=D.title?'<div style="font-size:17px;opacity:.9;margin-top:4px">'+esc(D.title)+'</div>':"";
 var ex=items(D.exps,1),ed=items(D.edus,0),h;
 if(D.t==1){h='<div class="s">'+ph+sec(L.ct,ct.map(function(x){return '<div style="margin:5px 0;word-break:break-all">'+x+'</div>'}).join(""))+sec(L.sk,sk)+sec(L.lg,lg)+'</div><div class="mn"><h1>'+nm+'</h1>'+ti+sec(L.sum,sm)+sec(L.exp,ex)+sec(L.edu,ed)+sec(L.pj,pj)+sec(L.ce,ce)+'</div>'}
 else if(D.t==2){h='<div class="hd">'+ph+'<div><h1>'+nm+'</h1>'+ti+'<div class="ct">'+ct.join(" &nbsp;|&nbsp; ")+'</div></div></div><div class="bd">'+sec(L.sum,sm)+sec(L.exp,ex)+sec(L.edu,ed)+sec(L.sk,sk)+sec(L.lg,lg)+sec(L.pj,pj)+sec(L.ce,ce)+'</div>'}
 else if(D.t==3){h='<h1>'+nm+'</h1>'+ti+'<div style="margin-top:8px;color:#555;font-size:13px">'+ct.join(" &nbsp;•&nbsp; ")+'</div>'+sec(L.sum,sm)+sec(L.exp,ex)+sec(L.edu,ed)+sec(L.sk,'<div>'+chips(D.skills).map(esc).join(" • ")+'</div>')+sec(L.lg,chips(D.langs).map(esc).join(" • "))+sec(L.pj,pj)+sec(L.ce,ce)}
 else{h=ph+'<h1>'+nm+'</h1>'+ti+'<div style="margin-top:8px;color:#555;font-size:13px">'+ct.join(" &nbsp;•&nbsp; ")+'</div><div class="l">'+sec(L.sum,sm)+sec(L.exp,ex)+sec(L.edu,ed)+'</div>'+sec(L.sk,sk)+sec(L.lg,chips(D.langs).map(esc).join(" • "))+sec(L.pj,pj)+sec(L.ce,ce)}
 c.innerHTML=h;fit()}
function fit(){var w=$("wrap").clientWidth-24;if(w<=0)return;var z=Math.min(1,w/794);$("cv").style.zoom=z}
function score(){var p=0,t=[];
 function ck(ok,pts,tip){if(ok)p+=pts;else t.push(tip)}
 ck(D.name,10,"اكتب اسمك");ck(D.title,10,"حط مسمى وظيفي واضح");ck(D.phone,10,"ضيف رقم موبايل");ck(/@/.test(D.email),10,"ضيف إيميل صحيح");
 ck(D.sum.length>60,15,"النبذة تكون من 2 لـ 3 جمل (60 حرف على الأقل)");
 ck(D.exps.some(function(e){return e.r&&e.d}),15,"ضيف خبرة واحدة على الأقل واكتب إنجازاتك");
 ck(D.edus.some(function(e){return e.r}),10,"ضيف مؤهلك الدراسي");ck(chips(D.skills).length>=4,10,"ضيف 4 مهارات أو أكتر");
 ck(D.photo,5,"الصورة اختيارية بس بتفرق في بعض الشركات");ck(chips(D.langs).length,5,"ضيف اللغات اللي بتتكلمها");
 if(D.exps.some(function(e){return e.d&&!/\d/.test(e.d)}))t.push("حط أرقام في إنجازاتك (مثال: زودت المبيعات 20%)");
 $("sc").style.width=p+"%";$("tips").innerHTML=p>=95?"🌟 السيرة ممتازة وجاهزة!":t.slice(0,4).map(function(x){return "• "+x}).join("<br>")}
function upd(){save();render();score()}
$("print").onclick=function(){document.title=(D.name||"CV")+" - CV";window.print()};
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="cv-backup.json";a.click()};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);for(var k in o)D[k]=o[k];fill()}catch(e){alert("الملف مش صالح")}};r.readAsText(f)};
$("clear").onclick=function(){if(confirm("تمسح كل البيانات؟")){var t=D.t,c=D.c;D={t:t,c:c,lang:"ar",photo:"",name:"",title:"",phone:"",email:"",city:"",link:"",sum:"",exps:[],edus:[],skills:"",langs:"",certs:"",proj:""};fill()}};
$("sample").onclick=function(){D.name="أحمد محمد علي";D.title="محاسب أول";D.phone="01012345678";D.email="ahmed@example.com";D.city="الإسكندرية";D.link="linkedin.com/in/ahmed";
 D.sum="محاسب بخبرة 5 سنين في الحسابات العامة والموازنات. بحب الدقة والالتزام بالمواعيد، وعندي خبرة قوية في برامج المحاسبة والإكسل.";
 D.exps=[{r:"محاسب أول",co:"شركة النيل للتجارة",p:"2021 - الآن",d:"إعداد القوائم المالية الشهرية\nقللت وقت إقفال الشهر من 10 أيام لـ 6 أيام\nإدارة فريق من 3 محاسبين"},{r:"محاسب",co:"مكتب الأمل للمراجعة",p:"2019 - 2021",d:"مراجعة حسابات 15 عميل\nتجهيز الإقرارات الضريبية"}];
 D.edus=[{r:"بكالوريوس تجارة - محاسبة",co:"جامعة الإسكندرية",p:"2015 - 2019"}];
